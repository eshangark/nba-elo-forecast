[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
dynamic = ["version"]
description = "NBA forecasts and an evidence-driven basketball analytics dashboard"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["tzdata>=2024.1"]

[tool.setuptools.packages.find]
include = ["nba_forecast*"]

[tool.setuptools.dynamic]
version = {attr = "nba_forecast.__version__"}
