name: Validate code

"on":
  push:
    branches: [main]
    paths-ignore:
      - 'data/seasons/**'
      - '**/*.md'
      - 'paper/**'
  pull_request:
    paths-ignore:
      - 'data/seasons/**'
      - '**/*.md'
      - 'paper/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install application and research dependencies
        run: python -m pip install -r requirements-fit.txt
      - name: Check Python sources
        run: python -m compileall -q app.py nba_forecast scripts tests
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
